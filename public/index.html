<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安心価格ナビ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: #f0f4f8;
      color: #333;
      padding: 24px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 16px; }

    /* タブ */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #dce8f4;
    }
    .tab-btn {
      padding: 8px 22px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-size: 0.95rem;
      color: #999;
      cursor: pointer;
      font-weight: bold;
      transition: color 0.15s;
    }
    .tab-btn.active { color: #4a90d9; border-bottom-color: #4a90d9; }
    .tab-btn:hover:not(.active) { color: #555; }

    /* 検索フォーム */
    .search-form { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-input {
      flex: 1; padding: 10px 14px;
      border: 2px solid #c8d8ea; border-radius: 8px;
      font-size: 1rem; outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #4a90d9; }
    .search-btn {
      padding: 10px 22px; background: #4a90d9; color: white;
      border: none; border-radius: 8px; font-size: 1rem;
      cursor: pointer; white-space: nowrap; transition: background 0.2s;
    }
    .search-btn:hover { background: #2c75c5; }
    .search-btn:disabled { background: #aaa; cursor: default; }

    .status-bar { font-size: 0.82rem; color: #888; margin-bottom: 20px; min-height: 20px; }

    /* 空状態 */
    .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
    .empty-state .icon { font-size: 4rem; margin-bottom: 12px; }
    .empty-state p { font-size: 1rem; }

    /* ゲームリンク */
    .game-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: #2a1a06; color: #f0c040;
      border-radius: 8px; font-size: 0.85rem; text-decoration: none;
      font-weight: bold; margin-bottom: 20px;
    }
    .game-link:hover { background: #3d2a0a; }

    /* グリッドレイアウト */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card {
      background: white; border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 {
      font-size: 1rem; color: #555; margin-bottom: 16px;
      border-bottom: 2px solid #e8f0fe; padding-bottom: 8px;
    }

    /* 最安値バッジ */
    .cheapest-badge {
      display: inline-block; background: #ff6b35; color: white;
      padding: 2px 10px; border-radius: 20px; font-size: 0.75rem;
      font-weight: bold; margin-left: 8px; vertical-align: middle;
    }

    /* 価格テーブル */
    .price-table { width: 100%; border-collapse: collapse; }
    .price-table tr { border-bottom: 1px solid #f0f0f0; }
    .price-table tr:last-child { border-bottom: none; }
    .price-table td { padding: 10px 4px; font-size: 0.9rem; vertical-align: top; }
    .price-table .rank { color: #999; font-size: 0.8rem; width: 28px; padding-top: 12px; }
    .price-table .shop-cell { width: 110px; }
    .shop-name { font-weight: bold; font-size: 0.88rem; line-height: 1.3; }
    .item-name { font-size: 0.72rem; color: #999; margin-top: 2px; line-height: 1.3; }
    .actual { font-size: 1.05rem; font-weight: bold; color: #1a1a2e; }
    .detail { color: #999; font-size: 0.75rem; margin-top: 2px; }
    .free-ship { color: #2e7d32; font-size: 0.75rem; }
    .sale-badge { display: inline-block; background: #e53935; color: white; font-size: 0.68rem; font-weight: bold; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
    .original-price { color: #bbb; font-size: 0.75rem; text-decoration: line-through; }
    .points-tag { color: #e65100; font-size: 0.72rem; font-weight: bold; }
    .src-yahoo   { display: inline-block; background: #720096; color: white; font-size: 0.62rem; font-weight: bold; padding: 1px 5px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
    .src-rakuten { display: inline-block; background: #bf0000; color: white; font-size: 0.62rem; font-weight: bold; padding: 1px 5px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
    .src-amazon  { display: inline-block; background: #ff9900; color: #111;  font-size: 0.62rem; font-weight: bold; padding: 1px 5px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
    .rakuten-warn { font-size: 0.78rem; color: #7a5000; background: #fffbea; border: 1px solid #ffe082; border-radius: 6px; padding: 6px 12px; margin-bottom: 12px; display: none; }

    /* お気に入りボタン（テーブル行） */
    .fav-btn {
      background: none; border: none; font-size: 1.1rem;
      cursor: pointer; padding: 2px 4px; color: #ddd;
      transition: color 0.15s; line-height: 1; vertical-align: middle;
    }
    .fav-btn:hover { color: #f5a623; }
    .fav-btn.active { color: #f5a623; }

    /* 安全スコア */
    .safety-item { margin-bottom: 14px; }
    .safety-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .safety-site { font-weight: bold; font-size: 0.88rem; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .safety-score { font-weight: bold; font-size: 0.95rem; }
    .safety-bar-bg { background: #e8ecef; border-radius: 4px; height: 10px; }
    .safety-bar { height: 10px; border-radius: 4px; transition: width 0.8s ease; }
    .label { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: bold; }
    .label-安心 { background: #e8f5e9; color: #2e7d32; }
    .label-普通 { background: #fff8e1; color: #f57f17; }
    .label-注意 { background: #fce4ec; color: #c62828; }
    .bar-安心 { background: #43a047; }
    .bar-普通 { background: #ffa726; }
    .bar-注意 { background: #ef5350; }
    .warnings { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
    .warn-tag { font-size: 0.7rem; background: #fce4ec; color: #c62828; border: 1px solid #ef9a9a; border-radius: 10px; padding: 1px 8px; }
    .good-tag { font-size: 0.7rem; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; border-radius: 10px; padding: 1px 8px; }

    /* 商品カードグリッド */
    .cards-title { font-size: 1rem; color: #555; margin-bottom: 14px; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .card-wrap { position: relative; }
    .card-fav-btn {
      position: absolute; top: 6px; right: 6px; z-index: 1;
      background: rgba(255,255,255,0.88); border: none; border-radius: 50%;
      width: 28px; height: 28px; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15); color: #ccc;
      transition: color 0.15s;
    }
    .card-fav-btn:hover { color: #f5a623; }
    .card-fav-btn.active { color: #f5a623; }
    .product-card {
      background: white; border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
    .card-img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #f7f7f7; padding: 8px; }
    .card-img-placeholder { width: 100%; aspect-ratio: 1; background: #f0f4f8; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #ccc; }
    .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; }
    .card-name { font-size: 0.78rem; color: #333; line-height: 1.4; margin-bottom: 6px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-shop { font-size: 0.7rem; color: #888; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-price { font-weight: bold; font-size: 0.95rem; color: #1a1a2e; }
    .card-ship { font-size: 0.7rem; color: #2e7d32; }
    .card-badge { margin-top: 6px; }

    /* もっと見るボタン */
    .show-more-btn {
      padding: 10px 32px; background: white; color: #4a90d9;
      border: 2px solid #4a90d9; border-radius: 24px; font-size: 0.92rem;
      font-weight: bold; cursor: pointer; transition: all 0.2s; margin: 8px 0 16px;
    }
    .show-more-btn:hover { background: #4a90d9; color: white; }

    /* ローディング */
    .loading-overlay { display: none; text-align: center; padding: 40px; color: #888; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #ddd; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 10px; }

    /* エラー表示 */
    .error-box { display: none; background: #fce4ec; color: #c62828; padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }

    /* お気に入りタブ */
    .fav-item {
      background: white; border-radius: 12px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
    }
    .fav-header { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .fav-img { width: 64px; height: 64px; object-fit: contain; background: #f7f7f7; border-radius: 8px; flex-shrink: 0; }
    .fav-img-placeholder { width: 64px; height: 64px; background: #f0f4f8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
    .fav-info { flex: 1; min-width: 0; }
    .fav-name { font-size: 0.88rem; font-weight: bold; color: #333; line-height: 1.4; margin-bottom: 4px; }
    .fav-shop { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .fav-price { font-size: 1rem; font-weight: bold; color: #1a1a2e; }
    .fav-added { font-size: 0.7rem; color: #bbb; margin-top: 2px; }
    .fav-remove { background: none; border: 1px solid #ddd; border-radius: 6px; color: #999; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; flex-shrink: 0; }
    .fav-remove:hover { border-color: #ef5350; color: #ef5350; }
    .fav-chart-wrap { height: 150px; }
    .fav-no-history { font-size: 0.78rem; color: #bbb; text-align: center; padding: 20px 0; }

    /* グラフナビゲーション */
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; min-height: 24px; }
    .chart-nav { display: flex; align-items: center; gap: 4px; }
    .chart-nav-btn {
      background: none; border: 1px solid #dce8f4; border-radius: 6px;
      padding: 1px 10px; font-size: 1rem; cursor: pointer; color: #4a90d9;
      transition: background 0.15s; line-height: 1.4;
    }
    .chart-nav-btn:hover:not(:disabled) { background: #e8f0fe; }
    .chart-nav-btn:disabled { color: #ccc; cursor: default; border-color: #eee; }
    .chart-page-info { font-size: 0.72rem; color: #888; min-width: 90px; text-align: center; }
    .new-low-badge {
      display: none; background: linear-gradient(135deg, #ff6b35, #f5a623);
      color: white; font-size: 0.72rem; font-weight: bold;
      padding: 2px 10px; border-radius: 12px; letter-spacing: 0.03em;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<h1>🛡️ 安心価格ナビ</h1>
<p class="subtitle">Yahoo!・楽天から価格と安全スコアをリアルタイム取得</p>

<!-- タブ -->
<div class="tabs">
  <button class="tab-btn active" id="tab-search-btn" onclick="switchTab('search')">🔍 検索</button>
  <button class="tab-btn" id="tab-favs-btn" onclick="switchTab('favs')">★ お気に入り <span id="fav-count-badge"></span></button>
</div>

<!-- ======== 検索タブ ======== -->
<div id="tab-search">
  <form class="search-form" onsubmit="doSearch(event)">
    <input id="search-input" class="search-input" type="text"
      placeholder="例: アイロン、イヤホン、プロテイン" autocomplete="off">
    <button id="search-btn" class="search-btn" type="submit">🔍 検索</button>
  </form>

  <div class="status-bar" id="status-bar"></div>
  <div class="error-box" id="error-box"></div>
  <div class="rakuten-warn" id="rakuten-warn"></div>
  <a href="/game" class="game-link">⛏️ トロッコアドベンチャー</a>

  <div class="empty-state" id="empty-state">
    <div class="icon">🔍</div>
    <p>キーワードを入力して検索してください</p>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div>取得中...</div>
  </div>

  <div id="results-area" style="display:none">
    <div class="grid">
      <div class="card">
        <h2>💴 実質価格ランキング <span style="font-size:0.8rem;color:#999">（商品価格＋送料）</span></h2>
        <table class="price-table" id="price-table"></table>
      </div>
      <div class="card">
        <h2>🛡️ 安全スコア</h2>
        <div id="safety-scores"></div>
      </div>
    </div>
    <div class="card">
      <div class="cards-title">🛒 商品一覧<span id="cards-count" style="font-size:0.82rem;color:#999;font-weight:normal"></span></div>
      <div class="cards-grid" id="cards-grid"></div>
    </div>
    <div style="text-align:center;margin-top:4px">
      <button id="show-more-btn" onclick="showMore()" style="display:none"
        class="show-more-btn">もっと見る</button>
    </div>
  </div>
</div>

<!-- ======== お気に入りタブ ======== -->
<div id="tab-favs" style="display:none">
  <div class="empty-state" id="favs-empty" style="display:none">
    <div class="icon">★</div>
    <p>お気に入りはまだありません</p>
    <p style="font-size:0.85rem;color:#bbb;margin-top:8px">検索結果の ☆ ボタンで追加できます</p>
  </div>
  <div id="favs-list"></div>
</div>

<script>
const RANKS = ["🥇", "🥈", "🥉", "4.", "5.", "6.", "7.", "8.", "9.", "10."];

let currentItems = [];
let currentKeyword = "";
let visibleCount = 12; // 最初に表示する件数
let favorites = [];
let favHistory = {};
const chartInstances = {}; // Chart.js インスタンスを id で管理
const chartPages     = {}; // 各商品の現在ページ（0=最新週）

// ── タブ切り替え ──────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById("tab-search").style.display = tab === "search" ? "" : "none";
  document.getElementById("tab-favs").style.display   = tab === "favs"   ? "" : "none";
  document.getElementById("tab-search-btn").classList.toggle("active", tab === "search");
  document.getElementById("tab-favs-btn").classList.toggle("active", tab === "favs");
  if (tab === "favs") loadAndRenderFavs();
}

// ── 検索 ─────────────────────────────────────────────────────────
async function doSearch(e) {
  e.preventDefault();
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;
  currentKeyword = q;

  setLoading(true);
  document.getElementById("error-box").style.display = "none";
  document.getElementById("empty-state").style.display = "none";
  document.getElementById("results-area").style.display = "none";

  try {
    const data = await fetch(`/api/search?q=${encodeURIComponent(q)}`).then(r => r.json());
    if (data.error) throw new Error(data.error);
    if (data.items.length === 0) {
      document.getElementById("empty-state").style.display = "block";
      document.getElementById("empty-state").querySelector("p").textContent =
        `「${q}」の検索結果が見つかりませんでした`;
      setLoading(false);
      return;
    }
    currentItems = data.items;
    renderAll(data);

    const t = new Date(data.fetchedAt).toLocaleTimeString("ja-JP");
    const src = data.sources || {};
    const parts = [];
    if (src.yahoo   > 0) parts.push(`Yahoo ${src.yahoo}件`);
    if (src.rakuten > 0) parts.push(`楽天 ${src.rakuten}件`);
    if (src.amazon  > 0) parts.push(`Amazon ${src.amazon}件`);
    const srcText = parts.length > 0 ? parts.join(" + ") : `${data.items.length}件`;
    document.getElementById("status-bar").textContent =
      `📡 ${srcText}  |  ${t} 取得`;

    const warns = [];
    if (data.yahooError)   warns.push(`⚠ Yahoo取得失敗（サーバーが --env-file=.env で起動されているか確認）`);
    if (data.rakutenError) warns.push(`⚠ 楽天取得失敗`);
    const warnEl = document.getElementById("rakuten-warn");
    if (warns.length > 0) {
      warnEl.innerHTML = warns.join("<br>");
      warnEl.style.display = "block";
    } else {
      warnEl.style.display = "none";
    }
    document.getElementById("results-area").style.display = "block";
  } catch (err) {
    const box = document.getElementById("error-box");
    box.textContent = `取得失敗: ${err.message}`;
    box.style.display = "block";
    document.getElementById("empty-state").style.display = "block";
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  document.getElementById("loading").style.display = on ? "block" : "none";
  document.getElementById("search-btn").disabled = on;
}

function renderAll(data) {
  visibleCount = 12; // 検索のたびにリセット
  const visible = currentItems.slice(0, visibleCount);
  renderPriceTable(visible);
  renderSafety(visible);
  renderCards(visible);
  renderShowMoreBtn();
}

function showMore() {
  visibleCount = currentItems.length; // 全件表示
  renderPriceTable(currentItems);
  renderSafety(currentItems);
  renderCards(currentItems);
  renderShowMoreBtn();
}

function renderShowMoreBtn() {
  const btn = document.getElementById("show-more-btn");
  const showing   = Math.min(visibleCount, currentItems.length);
  const total     = currentItems.length;
  const remaining = total - showing;

  const title = document.getElementById("cards-count");
  if (title) title.textContent = remaining > 0 ? ` (${showing} / ${total}件)` : ` (${total}件)`;

  if (remaining <= 0) {
    btn.style.display = "none";
  } else {
    btn.textContent = `もっと見る（残り ${remaining} 件）`;
    btn.style.display = "block";
  }
}

// ── お気に入りボタンの状態確認 ────────────────────────────────────
function isFaved(url) { return favorites.some(f => f.url === url); }

async function toggleFav(idx) {
  const item = currentItems[idx];
  if (!item) return;

  if (isFaved(item.url)) {
    const fav = favorites.find(f => f.url === item.url);
    if (!fav) return;
    await fetch(`/api/favorites/${fav.id}`, { method: "DELETE" });
    favorites = favorites.filter(f => f.url !== item.url);
  } else {
    await fetch("/api/favorites", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name:     item.name,
        shop:     item.shop,
        url:      item.url,
        image:    item.image,
        source:   item.source,
        keyword:  currentKeyword,
        price:    item.price,
      }),
    });
    await refreshFavCache();
  }
  await refreshFavCache();
  updateFavButtons();
  updateFavBadge();
}

async function refreshFavCache() {
  const r = await fetch("/api/favorites").then(r => r.json());
  favorites = r.favs;
  favHistory = r.hist;
}

function updateFavButtons() {
  document.querySelectorAll("[data-fav-idx]").forEach(btn => {
    const idx = parseInt(btn.dataset.favIdx);
    const item = currentItems[idx];
    if (!item) return;
    const on = isFaved(item.url);
    btn.textContent = on ? "★" : "☆";
    btn.classList.toggle("active", on);
    btn.title = on ? "お気に入りから削除" : "お気に入りに追加";
  });
}

function updateFavBadge() {
  const badge = document.getElementById("fav-count-badge");
  badge.textContent = favorites.length > 0 ? `(${favorites.length})` : "";
}

// ── 価格テーブル ──────────────────────────────────────────────────
function renderPriceTable(items) {
  const table = document.getElementById("price-table");
  table.innerHTML = items.map((item, i) => {
    const badge    = i === 0 ? `<span class="cheapest-badge">最安値</span>` : "";
    const saleBadge = item.isOnSale ? `<span class="sale-badge">SALE</span>` : "";
    const srcBadge = item.source === "Rakuten"
      ? `<span class="src-rakuten">楽天</span>`
      : item.source === "Amazon"
      ? `<span class="src-amazon">Amazon</span>`
      : `<span class="src-yahoo">Yahoo</span>`;
    const shipHtml = item.shipping === 0
      ? `<span class="free-ship">送料無料</span>` : `送料 ${item.shipping.toLocaleString()}円`;
    const originalHtml = item.isOnSale
      ? `<span class="original-price">${item.originalPrice.toLocaleString()}円</span> → ` : "";
    const pointsHtml = item.points > 0
      ? `<span class="points-tag">🎁 ${item.points}pt還元</span>` : "";
    const on = isFaved(item.url);
    return `<tr>
      <td class="rank">${RANKS[i] ?? (i + 1) + "."}</td>
      <td class="shop-cell">
        <div class="shop-name">${esc(item.shop)}${srcBadge}${badge}${saleBadge}</div>
        <div class="item-name">${esc(item.name)}</div>
      </td>
      <td>
        <div class="actual">${originalHtml}${item.actualPrice.toLocaleString()} 円</div>
        <div class="detail">${item.price.toLocaleString()}円 + ${shipHtml}</div>
        ${pointsHtml ? `<div>${pointsHtml}</div>` : ""}
      </td>
      <td>
        <button class="fav-btn ${on ? "active" : ""}" data-fav-idx="${i}"
          onclick="toggleFav(${i})" title="${on ? "お気に入りから削除" : "お気に入りに追加"}">
          ${on ? "★" : "☆"}
        </button>
      </td>
    </tr>`;
  }).join("");
}

// ── 安全スコア ────────────────────────────────────────────────────
function renderSafety(items) {
  const sorted = [...items].sort((a, b) => b.score - a.score);
  document.getElementById("safety-scores").innerHTML = sorted.map(item => {
    const GOOD_TAGS = new Set(["レビュー多い", "送料無料", "返品保証あり"]);
    const warnHtml = `<div class="warnings">${item.warnings.map(w =>
      GOOD_TAGS.has(w)
        ? `<span class="good-tag">✓ ${esc(w)}</span>`
        : `<span class="warn-tag">⚠ ${esc(w)}</span>`
    ).join("")}</div>`;
    const stars = item.rating > 0
      ? ` <span style="color:#f5a623;font-size:0.75rem">★${item.rating.toFixed(1)}</span>` +
        (item.reviewCount > 0 ? `<span style="color:#999;font-size:0.72rem">(${item.reviewCount}件)</span>` : "")
      : "";
    return `<div class="safety-item">
      <div class="safety-header">
        <span class="safety-site" title="${esc(item.shop)}">${esc(item.shop)}${stars}</span>
        <span>
          <span class="label label-${item.label}">${item.label}</span>
          <span class="safety-score">&nbsp;${item.score}点</span>
        </span>
      </div>
      <div class="safety-bar-bg">
        <div class="safety-bar bar-${item.label}" style="width:${item.score}%"></div>
      </div>
      ${warnHtml}
    </div>`;
  }).join("");
}

// ── 商品カード ────────────────────────────────────────────────────
function renderCards(items) {
  document.getElementById("cards-grid").innerHTML = items.map((item, i) => {
    const imgHtml = item.image
      ? `<img class="card-img" src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="card-img-placeholder" style="display:none">📦</div>`
      : `<div class="card-img-placeholder">📦</div>`;
    const shipHtml = item.shipping === 0
      ? `<div class="card-ship">送料無料</div>`
      : `<div style="font-size:0.7rem;color:#888">送料 ${item.shipping.toLocaleString()}円</div>`;
    const srcBadge = item.source === "Rakuten"
      ? `<span class="src-rakuten">楽天市場</span>`
      : item.source === "Amazon"
      ? `<span class="src-amazon">Amazon</span>`
      : `<span class="src-yahoo">Yahoo!</span>`;
    const saleLine = item.isOnSale
      ? `<div><span class="original-price">${item.originalPrice.toLocaleString()}円</span> <span class="sale-badge">SALE</span></div>` : "";
    const pointsLine = item.points > 0
      ? `<div class="points-tag">🎁 ${item.points}pt還元</div>` : "";
    const on = isFaved(item.url);
    const inner = `
      ${imgHtml}
      <button class="card-fav-btn ${on ? "active" : ""}" data-fav-idx="${i}"
        onclick="event.preventDefault();toggleFav(${i})"
        title="${on ? "お気に入りから削除" : "お気に入りに追加"}">${on ? "★" : "☆"}</button>
      <div class="card-body">
        <div style="margin-bottom:4px">${srcBadge}</div>
        <div class="card-name">${esc(item.name)}</div>
        <div class="card-shop">${esc(item.shop)}</div>
        ${saleLine}
        <div class="card-price">${item.actualPrice.toLocaleString()}円</div>
        ${shipHtml}
        ${pointsLine}
        <div class="card-badge">
          <span class="label label-${item.label}">${item.label} ${item.score}点</span>
        </div>
      </div>`;
    return `<div class="card-wrap">${
      item.url
        ? `<a class="product-card" href="${esc(item.url)}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="product-card">${inner}</div>`
    }</div>`;
  }).join("");
}

// ── お気に入りタブ ────────────────────────────────────────────────
async function loadAndRenderFavs() {
  await refreshFavCache();
  renderFavs();
  updateFavBadge();
}

function renderFavs() {
  const list  = document.getElementById("favs-list");
  const empty = document.getElementById("favs-empty");

  if (favorites.length === 0) {
    empty.style.display = "block";
    list.innerHTML = "";
    return;
  }
  empty.style.display = "none";

  // 既存チャートを全て破棄してからHTML再生成
  Object.values(chartInstances).forEach(c => c.destroy());
  Object.keys(chartInstances).forEach(k => delete chartInstances[k]);

  list.innerHTML = favorites.map(fav => {
    const imgHtml = fav.image
      ? `<img class="fav-img" src="${esc(fav.image)}" alt="${esc(fav.name)}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="fav-img-placeholder" style="display:none">📦</div>`
      : `<div class="fav-img-placeholder">📦</div>`;
    const hist        = favHistory[fav.id] || [];
    const latestPrice = hist.length > 0 ? hist[hist.length - 1].price : fav.price;
    const added       = new Date(fav.addedAt).toLocaleDateString("ja-JP");
    const srcBadge    = fav.source === "Rakuten"
      ? `<span class="src-rakuten">楽天</span>`
      : fav.source === "Amazon"
      ? `<span class="src-amazon">Amazon</span>`
      : `<span class="src-yahoo">Yahoo</span>`;
    const id = fav.id;
    const chartSection = hist.length >= 1
      ? `<div>
           <div class="chart-header">
             <span id="chart-low-${id}" class="new-low-badge">🎉 最安値更新！！</span>
             <div class="chart-nav">
               <button id="chart-prev-${id}" class="chart-nav-btn"
                 onclick="buildFavChart('${id}', (chartPages['${id}']||0)+1)" title="前の週">‹</button>
               <span id="chart-page-${id}" class="chart-page-info"></span>
               <button id="chart-next-${id}" class="chart-nav-btn"
                 onclick="buildFavChart('${id}', (chartPages['${id}']||0)-1)" title="次の週">›</button>
             </div>
           </div>
           <div class="fav-chart-wrap"><canvas id="chart-${id}"></canvas></div>
         </div>`
      : `<div class="fav-no-history">価格データを取得中です</div>`;
    return `<div class="fav-item">
      <div class="fav-header">
        ${imgHtml}
        <div class="fav-info">
          <div class="fav-name">${esc(fav.name)}</div>
          <div class="fav-shop">${esc(fav.shop)} ${srcBadge}</div>
          <div class="fav-price">${latestPrice.toLocaleString()} 円</div>
          <div class="fav-added">追加日: ${added}</div>
        </div>
        <button class="fav-remove" onclick="removeFav('${fav.id}')">削除</button>
      </div>
      ${chartSection}
    </div>`;
  }).join("");

  // 各商品のグラフを最新週（page=0）から描画
  favorites.forEach(fav => {
    if ((favHistory[fav.id] || []).length >= 1) buildFavChart(fav.id, 0);
  });
}

// 履歴データの日付の抜けを埋める（データがない日は null）
function fillDates(hist) {
  if (hist.length === 0) return [];
  const priceMap = {};
  hist.forEach(h => priceMap[h.date] = h.price);
  const start = new Date(hist[0].date + "T00:00:00");
  const end   = new Date(hist[hist.length - 1].date + "T00:00:00");
  const result = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    // toISOString() は UTC 変換されるため日本時間で1日ずれる → ローカル日付で生成する
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    result.push({ date: key, price: priceMap[key] ?? null });
  }
  return result;
}

// グラフを描画（page=0 が最新週、増えるほど過去へ）
function buildFavChart(favId, page) {
  const hist = favHistory[favId] || [];
  if (hist.length < 1) return;

  const filled     = fillDates(hist);
  const totalDays  = filled.length;
  const totalPages = Math.ceil(totalDays / 7);
  const safePage   = Math.max(0, Math.min(page, totalPages - 1));
  chartPages[favId] = safePage;

  // 最新7日 = page 0、過去に遡るほど page 増加
  const endIdx   = totalDays - safePage * 7;
  const startIdx = Math.max(0, endIdx - 7);
  const slice    = filled.slice(startIdx, endIdx);

  // 全期間の最安値（null除く）
  const allPrices = hist.map(h => h.price);
  const globalMin = Math.min(...allPrices);

  // 最新価格が全期間の最安値かどうか → 「最安値更新」バッジ表示判定
  const latestPrice = hist[hist.length - 1]?.price;
  const isNewLow    = hist.length > 1 && latestPrice === globalMin;

  // x軸ラベル（月/日 形式）
  const labels = slice.map(h => {
    const d = new Date(h.date + "T00:00:00");
    return `${d.getMonth() + 1}/${d.getDate()}`;
  });
  const prices = slice.map(h => h.price);

  // 最安値の点はオレンジ、それ以外は青
  const pointColors = prices.map(p => p === null ? "transparent" : p === globalMin ? "#ff6b35" : "#4a90d9");
  const pointSizes  = prices.map(p => p === null ? 0 : p === globalMin ? 7 : 4);

  // ナビゲーションボタンとバッジを更新
  const prevBtn  = document.getElementById(`chart-prev-${favId}`);
  const nextBtn  = document.getElementById(`chart-next-${favId}`);
  const pageInfo = document.getElementById(`chart-page-${favId}`);
  const lowBadge = document.getElementById(`chart-low-${favId}`);
  if (prevBtn)  prevBtn.disabled  = safePage >= totalPages - 1;
  if (nextBtn)  nextBtn.disabled  = safePage <= 0;
  if (lowBadge) lowBadge.style.display = isNewLow ? "inline-block" : "none";
  if (pageInfo && slice.length > 0) {
    const s = new Date(slice[0].date + "T00:00:00");
    const e = new Date(slice[slice.length - 1].date + "T00:00:00");
    pageInfo.textContent = `${s.getMonth()+1}/${s.getDate()} 〜 ${e.getMonth()+1}/${e.getDate()}`;
  }

  // 既存チャートを破棄して再描画
  if (chartInstances[favId]) { chartInstances[favId].destroy(); delete chartInstances[favId]; }
  const canvas = document.getElementById(`chart-${favId}`);
  if (!canvas) return;

  chartInstances[favId] = new Chart(canvas, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "価格（円）",
        data:  prices,
        borderColor: "#4a90d9",
        backgroundColor: "rgba(74,144,217,0.1)",
        tension: 0.1,
        pointRadius: pointSizes,
        pointBackgroundColor: pointColors,
        spanGaps: true, // null（データなし日）をまたいで線を繋ぐ
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: ctx => ctx.parsed.y !== null ? `${ctx.parsed.y.toLocaleString()}円` : "データなし" }
        },
      },
      scales: {
        y: { ticks: { callback: v => v.toLocaleString() + "円", font: { size: 11 } } },
        x: { ticks: { font: { size: 10 }, maxRotation: 0 }, grid: { display: false } },
      },
    },
  });
}

async function removeFav(id) {
  await fetch(`/api/favorites/${id}`, { method: "DELETE" });
  await refreshFavCache();
  renderFavs();
  updateFavBadge();
  updateFavButtons();
}

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// 起動時にお気に入り件数をバッジ表示
refreshFavCache().then(updateFavBadge);
</script>
